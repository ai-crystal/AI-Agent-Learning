<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从语言模型到智能体</title>
  <meta name="description" content="从语言模型到智能体：AI Agent 的技术演进与工程实现">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    :root { --theme-color: #a83232; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .sidebar { border-right: 1px solid #eee; }
    .sidebar ul li a { font-size: 14px; }
    .markdown-section { max-width: 900px; padding: 28px 36px 80px; }
    .markdown-section img { max-width: 100%; height: auto; display: block; margin: 1.2em auto; }
    .markdown-section figcaption { text-align: center; color: #777; font-size: 13px; margin-top: -0.6em; }
    .cover { background: radial-gradient(circle at 20% 20%, #26384b 0, #0b1119 45%, #05080d 100%); }
    .cover-main h1 { font-size: clamp(2.2rem, 7vw, 4.5rem); letter-spacing: .08em; }
    .cover-main blockquote { color: #d7e0ea; font-size: 1.05rem; }
    .cover-main p { color: #aab8c6; }
    .cover-main a { font-weight: 600; }
    .cover-main .cover-download { display: inline-block; margin: .9rem .35rem;
      padding: .7rem 1.25rem; border: 1px solid rgba(255,255,255,.8);
      border-radius: 4px; color: #fff !important; text-decoration: none; }
    .cover-main .cover-download:hover { background: #fff; color: #111 !important; }
    .app-nav { display: none; }
    @media (max-width: 768px) {
      .markdown-section { padding: 20px 18px 60px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '从语言模型到智能体',
      repo: 'https://github.com/ai-crystal/AI-Agent-Learning',
      homepage: 'README.md',
      loadSidebar: true,
      coverpage: true,
      routerMode: 'hash',
      relativePath: false,
      subMaxLevel: 2,
      maxLevel: 3,
      auto2top: true,
      search: {
        placeholder: '搜索全书',
        noData: '没有找到内容。',
        paths: 'auto',
        depth: 3
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        firstText: '回到开头',
        lastText: '去往结尾'
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      mermaidConfig: { querySelector: '.mermaid' },
      plugins: [
        function (hook) {
          hook.beforeEach(function (markdown) {
            var imageBase = new URL('book/images/', document.baseURI).href;
            return markdown.replace(/\.\.\/images\//g, imageBase);
          });
          hook.doneEach(function () {
            if (window.renderMathInElement) {
              window.renderMathInElement(document.querySelector('.markdown-section'), {
                delimiters: [
                  { left: '$$', right: '$$', display: true },
                  { left: '\\[', right: '\\]', display: true },
                  { left: '\\(', right: '\\)', display: false },
                  { left: '$', right: '$', display: false }
                ],
                throwOnError: false,
                ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
              });
            }
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.5/dist/mermaid.min.js"></script>
  <script>if (window.mermaid) { mermaid.initialize({ startOnLoad: false, theme: 'neutral' }); }</script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
