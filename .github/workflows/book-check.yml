name: book-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check chapter links and figures
        run: python tools/verify_repo.py
      - name: Check PDF size (20 MiB limit)
        run: python tools/pdf_size_guard.py --check
